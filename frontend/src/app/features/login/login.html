<div class="auth">
  <header class="head auth-head">
    <div class="marca" aria-hidden="true"><app-icone nome="marca" /></div>
    <h1 class="title">MealMath</h1>
    <p class="subtitle">Entre para acompanhar quanto suas refeições custam de verdade.</p>
  </header>

  <form class="card" [formGroup]="form" (ngSubmit)="entrar()">
    <div class="fld" [class.invalido]="invalido('email')">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="voce@email.com"
        autocomplete="email"
        [attr.aria-invalid]="invalido('email')"
      />
      @if (mensagem('email'); as aviso) {
        <p class="erro-campo">{{ aviso }}</p>
      }
    </div>

    <div class="fld" [class.invalido]="invalido('senha')">
      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input
          id="senha"
          [type]="mostrarSenha() ? 'text' : 'password'"
          formControlName="senha"
          placeholder="Sua senha"
          autocomplete="current-password"
          [attr.aria-invalid]="invalido('senha')"
        />
        <button
          type="button"
          class="alternar-senha"
          [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="mostrarSenha()"
          (click)="alternarSenha()"
        >
          <app-icone [nome]="mostrarSenha() ? 'olho-fechado' : 'olho'" />
        </button>
      </div>
      @if (mensagem('senha'); as aviso) {
        <p class="erro-campo">{{ aviso }}</p>
      }
    </div>

    @if (erro(); as falha) {
      <p class="erro-form" role="alert">{{ falha }}</p>
    }

    <button class="btn" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="foot-note">
    Ainda não tem conta? <a routerLink="/cadastro">Criar conta</a>
  </p>
</div>
