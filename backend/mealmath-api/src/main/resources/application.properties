spring.application.name=mealmath-api

# Le o .env da raiz do modulo como fonte de propriedades. "optional:" para que ambientes que
# injetam as credenciais como variaveis de ambiente de verdade (CI, deploy) subam sem o arquivo.
# Variavel de ambiente tem precedencia sobre o arquivo, entao dá para sobrescrever pontualmente.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
# As credenciais vem do ambiente (arquivo .env local, fora do controle de versao).
# spring.datasource.password nao tem valor default de proposito: sem a variavel a
# aplicacao falha no boot com erro claro, em vez de subir com uma senha versionada.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealmath_db}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Server Configuration
server.port=8082

# JWT
# Sem default: um segredo versionado permitiria a qualquer um forjar token de
# qualquer usuario. Minimo de 32 bytes (256 bits) para HS256 - a aplicacao nao
# sobe com chave menor. Gere com: openssl rand -base64 48
app.jwt.segredo=${APP_JWT_SEGREDO}
app.jwt.expiracao=8h
app.jwt.emissor=mealmath-api

# CORS: origens liberadas para o SPA. Ao servir o front pelo SSR com proxy /api o
# navegador chama a propria origem e nao ha preflight; esta lista cobre o dev
# server do Angular e pode ser ampliada por APP_CORS_ORIGENS (separado por virgula).
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:4200,http://192.168.0.20:4200}